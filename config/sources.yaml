# This allow-list is versioned with each image. Changes require a new image build.
lookback_hours: 28
max_per_feed: 10
candidate_limit: 45
max_items: 8
minimum_score: 6
timezone: Asia/Macau

feeds:
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
  - name: Google Research
    url: https://research.google/blog/rss/

# Tavily discovers current events missed by the official RSS sources. Its API key
# is injected at runtime as TAVILY_API_KEY; never add it to this file.
search:
  enabled: true
  provider: tavily
  max_results_per_query: 5
  search_depth: basic
  time_range: day
  queries:
    - major AI model or foundation model release
    - AI research paper benchmark training or inference breakthrough
    - open-source AI model agent or developer tool release
    - AI inference infrastructure hardware or optimization announcement
