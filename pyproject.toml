[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-briefing"
version = "0.1.0"
description = "Internal daily AI intelligence briefing, powered by an on-premises Qwen endpoint."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "openai>=1.54.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

